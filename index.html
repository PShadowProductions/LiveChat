<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TDRSS Livestream</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 75%;
      width: 75%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f9f9f9;
    }

    #chat-container {
      width: 50vw;
      height: 50vh;
      overflow: hidden;
    }

    iframe, .chat-widget {
      width: 40%;
      height: 40%;
      border: none;
    }
  </style>
</head>
<body>
  <div id="chat-container">
    <!-- Replace with your actual widget or embed code -->
    <script src="https://webchat.botframework.com/embed/YOUR-BOT-ID?s=secret-code"></script>
    <!-- OR if using an iframe-based widget, use this: -->
    <!-- <iframe src="https://your-teams-chat-url" class="chat-widget"></iframe> -->
  </div>
</body>
</html>
